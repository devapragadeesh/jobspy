name: scan

on:
  schedule:
    # Daily. The scanner itself skips companies scanned within the last two days,
    # so each company is checked every other day regardless of month boundaries.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      company_id:
        description: Scan only this company id (empty = all that are due)
        required: false
        default: ""
      force:
        description: Ignore the two-day interval
        required: false
        default: "false"

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
          COMPANY_ID: ${{ inputs.company_id }}
          FORCE: ${{ inputs.force }}
